# Deliberately under-mapped at v1: only the permanent-equity elements. None of
# the attested temporary-equity elements is specific to the preferred claim, and
# they would carry redeemable common and redeemable non-controlling interests
# into a concept the vocabulary defines as the preferred claim. A filer whose
# redeemable preferred sits in mezzanine needs an override, which is also why
# each entry below stands in rather than reads the concept exactly.

[[entry]]
form = "tag"
reading = "stand_in"
operands = [
  { taxonomy = "us-gaap", tag = "PreferredStockValue" },
]

[[entry]]
form = "tag"
reading = "stand_in"
operands = [
  { taxonomy = "us-gaap", tag = "PreferredStockValueOutstanding" },
]
