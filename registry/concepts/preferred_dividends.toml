# DividendsPreferredStock is the equity statement's declared preferred cash
# dividend, and stands in for this concept because it is the same claim declared
# rather than accrued, leaving out the accretion and redemption adjustments the
# meaning takes with them.

[[entry]]
form = "tag"
reading = "exact"
operands = [
  { taxonomy = "us-gaap", tag = "PreferredStockDividendsAndOtherAdjustments" },
]

# The dividends alone, without the accretion and redemption adjustments the
# meaning takes with them.
[[entry]]
form = "tag"
reading = "stand_in"
operands = [
  { taxonomy = "us-gaap", tag = "PreferredStockDividendsIncomeStatementImpact" },
]

[[entry]]
form = "tag"
reading = "stand_in"
operands = [
  { taxonomy = "us-gaap", tag = "DividendsPreferredStock" },
]
