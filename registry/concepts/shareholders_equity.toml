# StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest is not
# this concept: the meaning removes that portion, and the element below already
# excludes it.
#
# MembersEquity stands in for a limited liability company, and only where the
# filing states no StockholdersEquity for the period: members' equity is the
# owners' residual claim, and the element is defined as the portion attributable
# to the parent, so it excludes what the meaning excludes. PartnersCapital is not
# here: no fixture attests it.

[[entry]]
form = "tag"
reading = "exact"
operands = [
  { taxonomy = "us-gaap", tag = "StockholdersEquity" },
]

[[entry]]
form = "tag"
reading = "stand_in"
operands = [
  { taxonomy = "us-gaap", tag = "MembersEquity" },
]
