# LongTermDebt is not this concept: it is the total including current
# maturities, which short_term_debt already carries. Nor is
# OperatingLeaseLiabilityNoncurrent, which the meaning excludes.
#
# The concept is borrowings including finance lease obligations, and no element
# names both, so each tag stands in — the concept only for a filer with nothing
# of the other kind — and the sum of the two reads it whole.

[[entry]]
form = "tag"
reading = "stand_in"
operands = [
  { taxonomy = "us-gaap", tag = "LongTermDebtNoncurrent" },
]

[[entry]]
form = "tag"
reading = "stand_in"
operands = [
  { taxonomy = "us-gaap", tag = "FinanceLeaseLiabilityNoncurrent" },
]

[[entry]]
form = "sum"
reading = "exact"
operands = [
  { taxonomy = "us-gaap", tag = "LongTermDebtNoncurrent" },
  { taxonomy = "us-gaap", tag = "FinanceLeaseLiabilityNoncurrent" },
]
