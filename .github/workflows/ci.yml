# The gates, from the same runner an agent runs locally. Whatever `gates.sh`
# checks is what CI checks, so the two cannot drift. The job name `gates` is
# what the ruleset marks as a required status check — keep it stable.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install the rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: run every gate
        run: scripts/gates.sh
